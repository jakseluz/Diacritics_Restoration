[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diacritics_restoration"
version = "0.1.0"
description = "A project for restoring diacritics in Polish text."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "unidecode",
    "transformers",
    "datasets",
    "torch",
    "torchvision",
    "tqdm",
    "pandas",
    "scikit-learn",
    "numpy",
    "matplotlib",
    "seaborn",
    "evaluate",
    "jiwer",
    "matplotlib-inline"
]